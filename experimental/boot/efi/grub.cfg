# LCSAS recovery -- GRUB (UEFI) boot menu.
#
# Kernel/initrd paths below must match the names staged by
# BootableISOBuilder._install_boot_files (src/lcsas/meta/bootable.py):
# /boot/vmlinuz and /boot/initramfs.cpio.gz.  Pinned by
# tests/recovery_hardening/test_boot_config_paths.py.

set timeout=10
set default=0

menuentry "Linux 6.6 LTS (recovery)" --id=linux {
    linux  /boot/vmlinuz console=tty0 console=ttyS0,115200 quiet rdinit=/init
    initrd /boot/initramfs.cpio.gz
}

menuentry "Drop to BusyBox shell" --id=shell {
    linux  /boot/vmlinuz console=tty0 console=ttyS0,115200 rdinit=/bin/sh
    initrd /boot/initramfs.cpio.gz
}

menuentry "Run lcsas-restore directly (skip rootfs)" --id=restore {
    linux  /boot/vmlinuz console=tty0 console=ttyS0,115200 rdinit=/bin/lcsas-restore
    initrd /boot/initramfs.cpio.gz
}
