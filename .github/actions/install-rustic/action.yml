name: install-rustic
description: >-
  Install the pinned rustic release (x86_64 linux-gnu tarball) into
  ~/.local/bin, verify its SHA-256, and put it on PATH.

# The one place CI pins rustic (#693).  Every workflow that needs the
# pinned rustic calls this action after actions/checkout; none carries its
# own copy.  Keep the pin in lockstep with the README "Development" section
# so local devs and CI run the same version.  format-canary.yml installs
# the LATEST rustic on purpose and does not use this action.

inputs:
  version:
    description: rustic release version, without the leading v
    default: "0.11.2"
  asset:
    description: release asset file name
    default: "rustic-v0.11.2-x86_64-unknown-linux-gnu.tar.gz"
  sha256:
    description: >-
      SHA-256 of the asset, taken from the upstream .sha256 sidecar on the
      release page.  Verified locally on bump.
    default: "fb7b74a14418b2dd070360c9abb22607f8559bdd344a0adf1b33bc2e31f83f5f"

runs:
  using: composite
  steps:
    - name: Install rustic (pinned release tarball)
      shell: bash
      env:
        RUSTIC_VERSION: ${{ inputs.version }}
        RUSTIC_ASSET: ${{ inputs.asset }}
        RUSTIC_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.local/bin"
        cd "$(mktemp -d)"
        url="https://github.com/rustic-rs/rustic/releases/download/v${RUSTIC_VERSION}/${RUSTIC_ASSET}"
        echo "Downloading $url"
        curl -fsSL -o rustic.tar.gz "$url"
        # Strict SHA-256 verification against the pinned hash.
        actual=$(sha256sum rustic.tar.gz | awk '{print $1}')
        if [ "$RUSTIC_SHA256" != "$actual" ]; then
          echo "SHA256 mismatch: expected=$RUSTIC_SHA256 actual=$actual" >&2
          exit 1
        fi
        echo "SHA256 verified: $actual"
        tar -xzf rustic.tar.gz
        # Tarball layout: a single `rustic` binary at the archive root.
        install -m 0755 rustic "$HOME/.local/bin/rustic"
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
        "$HOME/.local/bin/rustic" --version
