name: upstream-canary

# Supply-chain canary (issue #372).  recovery/scripts/fetch_upstream.sh
# verifies pinned artifacts on download, and MetaVolumeBuilder re-verifies
# the local cache at bundle time — but neither notices when an UPSTREAM
# release is retagged, deleted, or its bytes silently change at the source.
# This job cold-fetches every artifact pinned in recovery/UPSTREAM.sha256
# straight from its source URL and verifies the SHA-256, so upstream drift
# is caught within days rather than at the next disaster recovery.
#
# No `schedule:` here, on purpose (#462): GitHub disables a scheduled file
# after 60 quiet days, PR trigger and all, and the 2026-08-05 -> 10-15 quiet
# spell did.  The weekly run lives in weekly.yml, which calls this file,
# so a quiet spell can now only switch off that.
on:
  workflow_dispatch: {}
  # The weekly run (weekly.yml).
  workflow_call: {}
  pull_request:
    paths:
      - "recovery/UPSTREAM.sha256"
      - "recovery/scripts/fetch_upstream.sh"
      - ".github/workflows/upstream-canary.yml"

jobs:
  verify-upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Cold-fetch + verify pinned upstream artifacts
        run: |
          # Fresh cache under RUNNER_TEMP: downloads every pinned artifact
          # from its source URL and verifies its SHA-256 against
          # recovery/UPSTREAM.sha256.  --no-extract keeps it to download +
          # verify (no tar/exec of untrusted bytes).  Non-zero exit ⇒ an
          # upstream release drifted from its pin.
          sh recovery/scripts/fetch_upstream.sh \
            --no-extract \
            --cache "$RUNNER_TEMP/upstream-cache"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Bundled CPython runs through the bundled musl loader on glibc (#714)
        run: |
          # Extract only the x86_64 musl CPython and the Alpine rootfs the
          # loader comes from (already downloaded and verified above), then
          # run the bundled interpreter through the bundled loader inside a
          # stock debian:12-slim container that has no musl.
          m="$RUNNER_TEMP/upstream-x86_64-musl.sha256"
          grep -E '  (python|musl)/x86_64-unknown-linux-musl/' recovery/UPSTREAM.sha256 > "$m"
          test "$(wc -l < "$m")" -eq 2
          sh recovery/scripts/fetch_upstream.sh --manifest "$m" \
            --cache "$RUNNER_TEMP/upstream-cache"
          python -m pip install -q -e . pytest
          LCSAS_RECOVERY_CACHE="$RUNNER_TEMP/upstream-cache" python -m pytest \
            tests/recovery_hardening/test_tier3_musl_loader_glibc_host.py \
            -v -rs -p no:cacheprovider --junitxml="$RUNNER_TEMP/musl.xml"
          # A skip here means the check did not run: fail instead.
          python scripts/ci_min_passed.py "$RUNNER_TEMP/musl.xml" --min-passed 2
