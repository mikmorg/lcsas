name: bin-parity

# GATE-08: prove the COMMITTED recovery/bin/<arch>/ artifacts -- the binaries
# the meta disc actually bundles -- still match current source.
#
# Almost every other gate builds a FRESH binary from source, so a C fix can
# land, pass every source-level gate, and still ship an UNFIXED committed
# binary on every meta disc burned afterwards.  This gate closes that hole:
# for each committed artifact it does a clean cross-rebuild with the pinned
# zig (recovery/TOOLCHAIN) + SOURCE_DATE_EPOCH and byte-compares it against
# the committed file.  Since the #320 promotion ALL targets are byte-gated
# (link-time stripping made Mach-O/PE reproducible; recovery/BIN_PARITY_EXEMPT
# is empty).  Pairs with macos-tier1.yml / the qemu+wine tests, which prove
# "it runs"; this proves "it embodies current source".
#
# REQUIRED-CHECK SHAPE (#412): `pull_request` is deliberately UNFILTERED and
# the path relevance moves into the `changes` job, so the always-reporting
# `bin-parity-required` job can be a required status check without blocking
# PRs that never touch gate-relevant paths ("Expected" forever).  push keeps
# its path filter for master monitoring; the weekly schedule is the
# toolchain-image-drift backstop.

on:
  push:
    paths:
      - 'recovery/src/**'
      - 'recovery/vendored/**'
      - 'recovery/bin/**'
      - 'recovery/Makefile'
      - 'recovery/TOOLCHAIN'
      - 'recovery/BIN_PARITY_EXEMPT'
      - 'recovery/scripts/bin_parity.py'
      - '.github/workflows/bin-parity.yml'
  pull_request:
  # Weekly backstop so toolchain-image drift is caught even when recovery/
  # is quiet.
  schedule:
    - cron: "37 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.detect.outputs.relevant }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect gate-relevant changes
        id: detect
        run: |
          # GATE-04 invariant: this list must stay IDENTICAL to push.paths
          # above (test_workflow_path_filter.py parses and compares both).
          cat > /tmp/gate-paths.txt <<'EOF'
          recovery/src/**
          recovery/vendored/**
          recovery/bin/**
          recovery/Makefile
          recovery/TOOLCHAIN
          recovery/BIN_PARITY_EXEMPT
          recovery/scripts/bin_parity.py
          .github/workflows/bin-parity.yml
          EOF
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if [ -z "$base" ] || [ -z "$head" ]; then
            # push / schedule / dispatch: always run the gate.
            echo "relevant=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$base" "$head")
          echo "changed files:"; echo "$changed" | sed 's/^/  /'
          rel=false
          while IFS= read -r pat; do
            pat="$(echo "$pat" | xargs)"; [ -z "$pat" ] && continue
            case "$pat" in
              *'/**')
                prefix="${pat%\*\*}"
                if printf '%s\n' "$changed" | grep -q "^${prefix}"; then rel=true; fi ;;
              *)
                if printf '%s\n' "$changed" | grep -qx "$pat"; then rel=true; fi ;;
            esac
          done < /tmp/gate-paths.txt
          echo "relevant=$rel" >> "$GITHUB_OUTPUT"
          echo "gate-relevant: $rel"

  bin-parity:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the pinned zig toolchain
        # Install exactly the version pinned in recovery/TOOLCHAIN
        # (e.g. "ziglang==0.16.0"), so byte-identity is meaningful.
        run: pip install "$(cat recovery/TOOLCHAIN)"

      - name: Rebuild-and-diff committed binaries
        run: make -C recovery bin-parity

  # The required status check (#412): reports on EVERY pull request.  Passes
  # instantly when no gate-relevant path changed; otherwise mirrors the real
  # job's result.  Branch protection requires THIS context, not `bin-parity`.
  bin-parity-required:
    needs: [changes, bin-parity]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Gate verdict
        run: |
          if [ "${{ needs.changes.outputs.relevant }}" != "true" ]; then
            echo "no gate-relevant paths changed -- pass"; exit 0
          fi
          if [ "${{ needs.bin-parity.result }}" = "success" ]; then
            echo "bin-parity passed"; exit 0
          fi
          echo "bin-parity result: ${{ needs.bin-parity.result }}"; exit 1

  canary-watchdog:
    # Uniform scheduled-canary watchdog (#420): scheduled-run failures
    # only email the workflow author, and two canaries rotted for ~5
    # weeks with a zero-issue backlog before anyone noticed (#418,
    # #419).  Job-level on a fresh runner, cancelled-aware (a
    # timeout-minutes kill is conclusion `cancelled`, invisible to
    # failure()), explicit issues:write, no error swallowing.  needs:
    # is load-bearing -- without it needs.*.result is empty and this
    # job never fires.
    runs-on: ubuntu-latest
    needs: [changes, bin-parity]
    if: >-
      always() && github.event_name == 'schedule'
      && (contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled'))
    permissions:
      issues: write
    steps:
      - name: File (or bump) the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="bin-parity: scheduled reproducibility check went red"
          body="Scheduled bin-parity run went red (bin-parity: ${{ needs.bin-parity.result }}) on \`${{ github.sha }}\`.

          The committed recovery binaries no longer rebuild byte-identical under the pinned toolchain (GATE-08) -- environment/toolchain drift has broken reproducibility even with no repo change.  June 2026's four consecutive red Mondays (the #408 unstripped-DWARF breakage) went unticketed; this watchdog exists so that cannot recur.  (A \`cancelled\` result usually means the job outgrew its timeout budget -- check step timings first.)
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing="$(gh issue list --state open \
            --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label bug --body "$body"
          fi
