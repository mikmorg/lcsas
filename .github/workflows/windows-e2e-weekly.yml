name: windows-e2e-weekly

# The weekly run of the INFRA-01 tier-3 Windows journey (build a fixture on
# Linux, run restore.bat unattended on a real windows-latest runner), so
# drift is caught even when no path-filtered file changes.  The gate itself
# lives in windows-e2e.yml, which also runs on PRs touching restore.bat's
# inputs; this file only schedules it.  The fixture artifact of a scheduled
# run belongs to THIS run's id (windows-debug.yml's fixture_run_id).
#
# WHY A SEPARATE FILE (#462): GitHub disables a workflow file that has a
# `schedule:` trigger after 60 days without repository activity, and a
# disabled file loses every trigger.  While the schedule shared a file with
# the pull_request trigger, the 2026-08-05 -> 10-15 quiet spell switched
# the PR-time journey off as well.  Keep this file schedule-only:
# test_schedule_only_workflows.py fails any scheduled file with PR or push
# triggers.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  windows-e2e:
    # Inside a called workflow `github.event_name` is the CALLER's
    # (`schedule`), so the called jobs behave as the in-file
    # schedule did.
    uses: ./.github/workflows/windows-e2e.yml

  canary-watchdog:
    # Uniform scheduled-canary watchdog (#420): scheduled-run failures
    # only email the workflow author, and two canaries rotted for ~5
    # weeks with a zero-issue backlog before anyone noticed (#418,
    # #419).  Job-level on a fresh runner, cancelled-aware (a
    # timeout-minutes kill is conclusion `cancelled`, invisible to
    # failure()), explicit issues:write, no error swallowing.  needs:
    # is load-bearing -- without it needs.*.result is empty and this
    # job never fires.
    runs-on: ubuntu-24.04
    needs: [windows-e2e]
    if: >-
      always() && github.event_name == 'schedule'
      && (contains(needs.*.result, 'failure')
          || contains(needs.*.result, 'cancelled'))
    permissions:
      issues: write
    steps:
      - name: File (or bump) the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="windows-e2e: scheduled restore.bat journey went red"
          body="Scheduled windows-e2e run went red (windows-e2e: ${{ needs.windows-e2e.result }}) on \`${{ github.sha }}\`.

          The single most likely heir journey -- Windows machine, double-click restore.bat (INFRA-01 tier 3) -- is unproven until this is green again.  (A \`cancelled\` result usually means the job outgrew its timeout budget -- check step timings first.)
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing="$(gh issue list --state open \
            --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label bug --body "$body"
          fi
