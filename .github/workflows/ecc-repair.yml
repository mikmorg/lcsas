name: ecc-repair

# The RS03 ECC repair proof (tests/integration/test_ecc_repair.py) is the only
# end-to-end validation of the disc-integrity layer's core promise: below-
# threshold disc damage repairs byte-identical, above-threshold fails loud. It
# is opt-in (LCSAS_ECC_REPAIR=1) and slow, so it never runs in the default
# push/PR suite. Two triggers opt in explicitly:
#   - the weekly run (ecc-weekly.yml calls this file) bounds toolchain/
#     environment-drift regressions to days;
#   - pull_request on the ECC wrapper paths gives immediate coverage to the
#     highest-risk edits (argument drift, wrong image targeted, redundancy
#     semantics) without waiting for Monday.
# See plans/audit-2026-06/GATE-05-schedule-ecc-repair-proof-ci.md.
#
# No `schedule:` here, on purpose (#462): GitHub disables a scheduled file
# after 60 quiet days, PR trigger and all.  The 2026-08-05 -> 10-15 quiet
# spell switched this proof off for PRs too.  The schedule lives in
# ecc-weekly.yml, so a quiet spell can now only switch off that.

on:
  pull_request:
    paths:
      - "src/lcsas/ecc/**"
      - "tests/integration/test_ecc_repair.py"
      - ".github/workflows/ecc-repair.yml"
  workflow_dispatch: {}
  # The weekly run (ecc-weekly.yml).
  workflow_call: {}

jobs:
  ecc-repair:
    runs-on: ubuntu-latest
    # Measured budget, not a guess (#419): the FMT-01 cross-conformance
    # pair made the suite outgrow the old 60-min limit -- the reverse
    # test (test_dvdisaster_repairs_lcsas_ecc_augmented_image) has the
    # deliberately-not-perf-tuned lcsas-ecc encoder (d19f1a2) write a
    # full ~700 MB RS03 medium, then real dvdisaster verify+repair it.
    # On 2026-07-13 the first three tests finished by minute 15 and the
    # fourth was still running at the minute-60 kill.  150 = the fast
    # three + the slow reverse test + headroom for runner variance.  A
    # weekly runner-hour is the honest price of the two-directional
    # conformance proof; do NOT reclaim it by shrinking the medium (RS03
    # is a full-medium format -- dvdisaster must recognise a real one).
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install xorriso and dvdisaster
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso dvdisaster
          xorriso -version
          dvdisaster --version
      - name: Build in-house lcsas-ecc (so the cross-conformance test runs)
        # The dvdisaster cross-conformance test (test_lcsas_ecc_repairs_
        # dvdisaster_augmented_image) needs a runnable lcsas-ecc, else it
        # SKIPS silently. Build it from current source and put it on PATH so
        # the test exercises THIS commit's decoder, not a stale committed bin.
        run: |
          make -C recovery build/lcsas-ecc
          echo "$GITHUB_WORKSPACE/recovery/build" >> "$GITHUB_PATH"
      - name: Install LCSAS (editable, with dev deps)
        run: make dev
      - name: RS03 repair proof + dvdisaster cross-conformance
        # Repair proof: below-threshold damage repairs byte-identical, above
        # fails loud. Cross-conformance (FMT-01, #321 closed): lcsas-ecc reads
        # real dvdisaster RS03 parity byte-exactly -- this is now a HARD GATE
        # (no longer xfail). A red run here means the in-house decoder has
        # diverged from dvdisaster's format and must be fixed before release.
        run: |
          echo "lcsas-ecc on PATH: $(command -v lcsas-ecc || echo MISSING)"
          LCSAS_ECC_REPAIR=1 pytest tests/integration/test_ecc_repair.py -v -rX -m integration
