name: audit-gate

on:
  # Directory globs over file pins: the old hand-picked file list silently
  # excluded vendored C, keyshare/iso9660/init/ecc sources, and every
  # recovery/scripts file, and carried a ghost `sanitize.sh` entry — a
  # behavior-breaking edit there merged unbuilt and untested (GATE-04). These
  # globs subsume that list. test_workflow_path_filter.py guards them.
  push:
    paths:
      - "recovery/src/**"
      - "recovery/tests/**"
      - "recovery/fuzz/**"
      - "recovery/vendored/**"
      - "recovery/scripts/**"
      - "recovery/Makefile"
      - "recovery/MANIFEST.sha256"
  pull_request:
    paths:
      - "recovery/src/**"
      - "recovery/tests/**"
      - "recovery/fuzz/**"
      - "recovery/vendored/**"
      - "recovery/scripts/**"
      - "recovery/Makefile"
      - "recovery/MANIFEST.sha256"

jobs:
  audit-gate:
    name: "Tier-1 audit gate (coverage + sanitize + fuzz-smoke)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang \
            gcovr \
            python3-pip
          # Install the lcsas package (editable) + dev deps. coverage-c Step 3
          # runs the tier-1 hardening tests (tests/recovery_hardening/), which
          # exercise the real binary and contribute main.c / disc_locator.c
          # coverage. tests/conftest.py imports `lcsas`; without the package
          # installed pytest fails at conftest collection (ModuleNotFoundError),
          # those tests never run, and CI coverage falls ~5pts below the local
          # figure the EXEMPTIONS contract is authored against -> false drift.
          pip3 install --break-system-packages -e ".[dev]"

      - name: Run audit-gate (default 60% threshold)
        run: make -C recovery audit-gate THRESHOLD=60
        env:
          # Soft-skip LCSAS_SANITIZE and LCSAS_COVERAGE opt-in flags
          # are not needed here — audit-gate calls the targets directly.
          PYTHONDONTWRITEBYTECODE: "1"
