name: ecc-weekly

# The weekly run of the RS03 ECC repair proof (GATE-05).  The proof itself
# lives in ecc-repair.yml, which also runs on PRs touching the ECC wrapper;
# this file only schedules it, so environment drift (a new dvdisaster in
# the runner image, say) surfaces within a week even when src/lcsas/ecc/
# is quiet.
#
# WHY A SEPARATE FILE (#462): GitHub disables a workflow file that has a
# `schedule:` trigger after 60 days without repository activity, and a
# disabled file loses every trigger.  While the schedule shared a file with
# the pull_request trigger, the 2026-08-05 -> 10-15 quiet spell switched
# off the PR-time proof as well.  Keep this file schedule-only:
# test_schedule_only_workflows.py fails any scheduled file with PR or push
# triggers.

on:
  schedule:
    - cron: "0 4 * * 1"          # Mondays 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ecc-repair:
    # The called file's timeout-minutes (150, measured: #419) applies
    # unchanged; inside a called workflow `github.event_name` is still
    # `schedule`.
    uses: ./.github/workflows/ecc-repair.yml

  canary-watchdog:
    # Scheduled-run failures only email the workflow author; the old
    # in-job step was `if: failure()` -- blind to conclusion `cancelled`,
    # which is exactly what a timeout-minutes kill produces, so four
    # straight dead Mondays filed nothing (#419).  Job-level on a fresh
    # runner, cancelled-aware, explicit issues:write, and no `|| true`:
    # if ticket-filing itself fails, this job fails loud.  Fleet-wide
    # pattern: #420.
    runs-on: ubuntu-24.04
    needs: [ecc-repair]
    if: >-
      always() && github.event_name == 'schedule'
      && (needs.ecc-repair.result == 'failure'
          || needs.ecc-repair.result == 'cancelled')
    permissions:
      issues: write
    steps:
      - name: File (or bump) the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          title="ecc-weekly: RS03 repair proof went red"
          body="Scheduled RS03 ECC repair proof (\`tests/integration/test_ecc_repair.py\`) result: **${{ needs.ecc-repair.result }}** on \`${{ github.sha }}\`.

          The disc-integrity repair path is unproven until this is green again -- every disc burned meanwhile could be unrepairable.  (A \`cancelled\` result usually means the job outgrew its timeout-minutes budget, not a test failure -- check step timings first.)
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing="$(gh issue list --state open \
            --search "\"$title\" in:title" \
            --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --label bug --body "$body"
          fi
