name: test

# Run the full LCSAS test suite against REAL rustic, xorriso, and dvdisaster.
# Issue #68 (resolves #52 item 6): "We must test all workflow paths involving
# rustic, with real rustic". No Protocol mocks here — this CI installs the
# actual binaries and exercises them end-to-end against the integration suite.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Pinned rustic release. Update in lockstep with README "Development"
      # section so local devs and CI run identical versions.
      RUSTIC_VERSION: "0.11.2"
      RUSTIC_ASSET: "rustic-v0.11.2-x86_64-unknown-linux-gnu.tar.gz"
      # SHA256 of the pinned asset, taken from the upstream-published
      # .sha256 sidecar on the release page. Verified locally on bump.
      RUSTIC_SHA256: "fb7b74a14418b2dd070360c9abb22607f8559bdd344a0adf1b33bc2e31f83f5f"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rustic (pinned release tarball)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          cd "$(mktemp -d)"
          url="https://github.com/rustic-rs/rustic/releases/download/v${RUSTIC_VERSION}/${RUSTIC_ASSET}"
          echo "Downloading $url"
          curl -fsSL -o rustic.tar.gz "$url"
          # Strict SHA256 verification against the pinned hash above.
          actual=$(sha256sum rustic.tar.gz | awk '{print $1}')
          if [ "$RUSTIC_SHA256" != "$actual" ]; then
            echo "SHA256 mismatch: expected=$RUSTIC_SHA256 actual=$actual" >&2
            exit 1
          fi
          echo "SHA256 verified: $actual"
          tar -xzf rustic.tar.gz
          # Tarball layout: a single `rustic` binary at the archive root.
          install -m 0755 rustic "$HOME/.local/bin/rustic"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify rustic installation
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          rustic --version

      - name: Install xorriso and dvdisaster
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso dvdisaster
          xorriso -version
          dvdisaster --version

      # NOTE: cdemu is NOT installed in CI.
      # The cdemu-daemon / cdemu-client packages require a loadable kernel
      # module (vhba) that is not available on GitHub-hosted runners, so the
      # e2e blind-restore suite (`make blind-restore` / `tests/e2e/...`) is
      # intentionally skipped here. Run that suite locally on a machine
      # with vhba + cdemu installed. See README "Development" section.

      - name: Install LCSAS (editable, with dev deps)
        run: make dev

      - name: C smoke (build all recovery binaries + run C unit tests)
        # Always-on, unconditional: audit-gate's path filter can drift again
        # (GATE-04), but this cheap gcc-only build cannot be filtered out of a
        # push/PR. After this lands, no C change anywhere under recovery/src or
        # recovery/vendored can merge unbuilt or with a failing C unit test.
        run: make -C recovery all test

      - name: Journey contract layer present (UX-08 layer 1)
        # The doc/script contract tests (UX-02/03/04/06) are the always-on
        # journey safety net: they pin every command quoted in the burned
        # recovery docs to the real tool interfaces.  They ride `make
        # test-unit`, but a future test-tree reorg could silently drop the
        # file and the net would vanish unnoticed.  Fail the build if the
        # contract file collects zero tests (moved/renamed/emptied).
        run: |
          set -euo pipefail
          pytest tests/unit/test_doc_command_contract.py --collect-only -q \
            | tee /tmp/contract_collect.log
          grep -Eq '[1-9][0-9]* tests? collected' /tmp/contract_collect.log

      - name: Run unit tests
        run: make test-unit

      - name: Meta bundling completeness (six-target contract)
        run: pytest tests/recovery_hardening/test_meta_bundling_completeness.py -v

      - name: Run integration tests
        run: make test-integration

      - name: Run e2e pipeline test (full scan→binpack→stage→ISO→ECC)
        # GATE-10: e2e_test.py used to hard-skip off /mnt/lcsas-data (the dev
        # VM LV), so the gate went green-by-skip everywhere else. Point it at
        # a CI scratch base and PROVE it ran: green-by-skip is the bug being
        # fixed, so we grep the summary for the pipeline test passing and fail
        # the step if it was skipped or never collected.
        run: |
          set -euo pipefail
          export LCSAS_E2E_BASE=/var/tmp/lcsas-e2e
          mkdir -p "$LCSAS_E2E_BASE"
          pytest tests/e2e/test_scripts.py::test_e2e_pipeline -v \
            | tee /tmp/e2e_pytest.log
          grep -Eq '1 passed' /tmp/e2e_pytest.log

      - name: Type-check (mypy strict)
        run: make typecheck

      - name: Lint (ruff)
        run: make lint

  # The recovery-hardening suite is where every behavioral test of
  # recovery/scripts/restore.sh lives (tier fallback, disc discovery,
  # tier-3 swap, doc-parity, UX).  `make gate` runs it as the final
  # "this build is shippable" step, but until GATE-02 it never ran in
  # CI — restore.sh behavior was enforced purely by local discipline.
  # Separate job (parallel to `test`) so a hardening failure is legible
  # at a glance.  test-e2e is deferred behind GATE-10 (it hard-skips
  # off-host); see tests/recovery_hardening/test_ci_workflow_parity.py
  # KNOWN_UNWIRED.
  recovery-hardening:
    runs-on: ubuntu-latest

    env:
      # Same pinned rustic as the `test` job — keep in lockstep.
      RUSTIC_VERSION: "0.11.2"
      RUSTIC_ASSET: "rustic-v0.11.2-x86_64-unknown-linux-gnu.tar.gz"
      RUSTIC_SHA256: "fb7b74a14418b2dd070360c9abb22607f8559bdd344a0adf1b33bc2e31f83f5f"
      # Skip-rot floor: minimum passed-test count.  qemu-user-static + wine +
      # stock restic (all installed below) let the aarch64/armv7/windows
      # committed-binary tests and the standard-tools compat gate actually
      # execute in CI, instead of skipping everywhere but the dev VM.
      # RE-BASELINED (issue #366): 581 tests collected; recent CI runs report
      # 550 passed / 26 skipped / 5 failed.  The Skip-rot floor step only runs
      # when the suite step is green (0 failures), at which point passed is
      # 581 - skips (~555); and even today 550 pass despite the 5 unrelated
      # failures, so passed is >= 550 whenever this floor evaluates.  540
      # (= 550 - 10) stays safely below that — never false-failing a PR —
      # while catching a chunk of tests silently rotting to skips (e.g. a
      # broken fixture or an uninstalled dep turning assertions into skips).
      # Never raise it to chase a flake; re-baseline down only from a
      # known-good run.
      FLOOR: "540"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rustic (pinned release tarball)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          cd "$(mktemp -d)"
          url="https://github.com/rustic-rs/rustic/releases/download/v${RUSTIC_VERSION}/${RUSTIC_ASSET}"
          echo "Downloading $url"
          curl -fsSL -o rustic.tar.gz "$url"
          actual=$(sha256sum rustic.tar.gz | awk '{print $1}')
          if [ "$RUSTIC_SHA256" != "$actual" ]; then
            echo "SHA256 mismatch: expected=$RUSTIC_SHA256 actual=$actual" >&2
            exit 1
          fi
          echo "SHA256 verified: $actual"
          tar -xzf rustic.tar.gz
          install -m 0755 rustic "$HOME/.local/bin/rustic"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install stock restic (pinned, for the standard-tools compat gate)
        # H4: tests/recovery_hardening/test_stock_restic_compat.py — the
        # "standard tools" restore tier — skips unless a STOCK upstream restic
        # (the Go original, not rustic, not bundled) is present.  No job
        # installed one, so that gate silently skipped forever: a rustic
        # upstream change that broke stock-restic readability of an LCSAS repo
        # would have passed CI green.  Pin restic 0.19.0 and verify it against
        # the SHA-256 already recorded in recovery/UPSTREAM.sha256, read
        # straight from that manifest so the hash can never drift from the pin.
        run: |
          set -euo pipefail
          asset="restic_0.19.0_linux_amd64.bz2"
          # Read the pinned hash from the manifest (repo root is the cwd here);
          # $2 == <path> skips comment lines and never re-hardcodes the value.
          expected=$(awk -v a="restic/x86_64-unknown-linux-musl/$asset" \
            '$2 == a {print $1}' recovery/UPSTREAM.sha256)
          if [ -z "$expected" ]; then
            echo "no pinned hash for $asset in recovery/UPSTREAM.sha256" >&2
            exit 1
          fi
          mkdir -p "$HOME/.local/bin"
          cd "$(mktemp -d)"
          url="https://github.com/restic/restic/releases/download/v0.19.0/$asset"
          echo "Downloading $url"
          curl -fsSL -o restic.bz2 "$url"
          actual=$(sha256sum restic.bz2 | awk '{print $1}')
          if [ "$expected" != "$actual" ]; then
            echo "restic SHA256 mismatch: expected=$expected actual=$actual" >&2
            exit 1
          fi
          echo "restic SHA256 verified: $actual"
          bunzip2 restic.bz2
          install -m 0755 restic "$HOME/.local/bin/restic"
          # The gate checks LCSAS_RESTIC_BIN first, then PATH; set the env var
          # so it unambiguously binds to this STOCK binary.
          echo "LCSAS_RESTIC_BIN=$HOME/.local/bin/restic" >> "$GITHUB_ENV"

      - name: Install xorriso + dvdisaster + qemu + wine
        run: |
          sudo apt-get update
          # qemu-user-static + wine let the cross-arch committed-binary
          # hardening tests (aarch64/armv7 via qemu, windows .exe via wine)
          # actually run here instead of skipping — raising the floor.
          sudo apt-get install -y xorriso dvdisaster qemu-user-static wine
          xorriso -version
          dvdisaster --version

      - name: Install LCSAS (editable, with dev deps)
        run: make dev

      - name: Build host tier-1 binaries + C unit tests
        # Gives the tier-1 hardening tests a build/lcsas-restore to target,
        # and runs the vendored C unit tests.  ~2 min.
        run: make -C recovery all test

      - name: Recovery hardening suite
        run: pytest tests/recovery_hardening/ -v --junitxml=/tmp/hardening.xml

      - name: Skip-rot floor
        # Fails if fewer than FLOOR tests passed — catches a regression that
        # silently turns assertions into skips.  See env.FLOOR for re-baseline.
        run: python3 scripts/ci_min_passed.py /tmp/hardening.xml --min-passed "$FLOOR"

      - name: Shell coverage floor (restore.sh)
        # GATE-09: a real, enforced line-coverage floor for the heir's single
        # entry point.  Fails the job if the trace-generating pytest run is
        # non-zero OR coverage drops below the documented Makefile threshold.
        # Self-contained (pytest + bash + tools/cov_shell.py); rides this job
        # because restore.sh's behavioral tests all live in recovery_hardening.
        run: make shell-coverage
