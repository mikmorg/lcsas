name: test

# Run the full LCSAS test suite against REAL rustic, xorriso, and dvdisaster.
# Issue #68 (resolves #52 item 6): "We must test all workflow paths involving
# rustic, with real rustic". No Protocol mocks here — this CI installs the
# actual binaries and exercises them end-to-end against the integration suite.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Pinned rustic release. Update in lockstep with README "Development"
      # section so local devs and CI run identical versions.
      RUSTIC_VERSION: "0.11.2"
      RUSTIC_ASSET: "rustic-v0.11.2-x86_64-unknown-linux-gnu.tar.gz"
      # SHA256 of the pinned asset, taken from the upstream-published
      # .sha256 sidecar on the release page. Verified locally on bump.
      RUSTIC_SHA256: "fb7b74a14418b2dd070360c9abb22607f8559bdd344a0adf1b33bc2e31f83f5f"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rustic (pinned release tarball)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          cd "$(mktemp -d)"
          url="https://github.com/rustic-rs/rustic/releases/download/v${RUSTIC_VERSION}/${RUSTIC_ASSET}"
          echo "Downloading $url"
          curl -fsSL -o rustic.tar.gz "$url"
          # Strict SHA256 verification against the pinned hash above.
          actual=$(sha256sum rustic.tar.gz | awk '{print $1}')
          if [ "$RUSTIC_SHA256" != "$actual" ]; then
            echo "SHA256 mismatch: expected=$RUSTIC_SHA256 actual=$actual" >&2
            exit 1
          fi
          echo "SHA256 verified: $actual"
          tar -xzf rustic.tar.gz
          # Tarball layout: a single `rustic` binary at the archive root.
          install -m 0755 rustic "$HOME/.local/bin/rustic"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify rustic installation
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          rustic --version

      - name: Install xorriso and dvdisaster
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso dvdisaster
          xorriso -version
          dvdisaster --version

      # NOTE: cdemu is NOT installed in CI.
      # The cdemu-daemon / cdemu-client packages require a loadable kernel
      # module (vhba) that is not available on GitHub-hosted runners, so the
      # e2e blind-restore suite (`make blind-restore` / `tests/e2e/...`) is
      # intentionally skipped here. Run that suite locally on a machine
      # with vhba + cdemu installed. See README "Development" section.

      - name: Install LCSAS (editable, with dev deps)
        run: make dev

      - name: C smoke (build all recovery binaries + run C unit tests)
        # Always-on, unconditional: audit-gate's path filter can drift again
        # (GATE-04), but this cheap gcc-only build cannot be filtered out of a
        # push/PR. After this lands, no C change anywhere under recovery/src or
        # recovery/vendored can merge unbuilt or with a failing C unit test.
        run: make -C recovery all test

      - name: Run unit tests
        run: make test-unit

      - name: Meta bundling completeness (six-target contract)
        run: pytest tests/recovery_hardening/test_meta_bundling_completeness.py -v

      - name: Run integration tests
        run: make test-integration

      - name: Type-check (mypy strict)
        run: make typecheck

      - name: Lint (ruff)
        run: make lint

  # The recovery-hardening suite is where every behavioral test of
  # recovery/scripts/restore.sh lives (tier fallback, disc discovery,
  # tier-3 swap, doc-parity, UX).  `make gate` runs it as the final
  # "this build is shippable" step, but until GATE-02 it never ran in
  # CI — restore.sh behavior was enforced purely by local discipline.
  # Separate job (parallel to `test`) so a hardening failure is legible
  # at a glance.  test-e2e is deferred behind GATE-10 (it hard-skips
  # off-host); see tests/recovery_hardening/test_ci_workflow_parity.py
  # KNOWN_UNWIRED.
  recovery-hardening:
    runs-on: ubuntu-latest

    env:
      # Same pinned rustic as the `test` job — keep in lockstep.
      RUSTIC_VERSION: "0.11.2"
      RUSTIC_ASSET: "rustic-v0.11.2-x86_64-unknown-linux-gnu.tar.gz"
      RUSTIC_SHA256: "fb7b74a14418b2dd070360c9abb22607f8559bdd344a0adf1b33bc2e31f83f5f"
      # Skip-rot floor: minimum passed-test count.  qemu-user-static + wine
      # below let the aarch64/armv7/windows committed-binary tests actually
      # execute in CI (they skip everywhere but the dev VM otherwise), so
      # the real floor is well above this.  RE-BASELINE: after the first
      # green run, read the "passed" count from the junit summary and set
      # FLOOR to (passed - 5).  This conservative starting value only
      # catches catastrophic skip-rot until that re-baseline lands.
      FLOOR: "200"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rustic (pinned release tarball)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          cd "$(mktemp -d)"
          url="https://github.com/rustic-rs/rustic/releases/download/v${RUSTIC_VERSION}/${RUSTIC_ASSET}"
          echo "Downloading $url"
          curl -fsSL -o rustic.tar.gz "$url"
          actual=$(sha256sum rustic.tar.gz | awk '{print $1}')
          if [ "$RUSTIC_SHA256" != "$actual" ]; then
            echo "SHA256 mismatch: expected=$RUSTIC_SHA256 actual=$actual" >&2
            exit 1
          fi
          echo "SHA256 verified: $actual"
          tar -xzf rustic.tar.gz
          install -m 0755 rustic "$HOME/.local/bin/rustic"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install xorriso + dvdisaster + qemu + wine
        run: |
          sudo apt-get update
          # qemu-user-static + wine let the cross-arch committed-binary
          # hardening tests (aarch64/armv7 via qemu, windows .exe via wine)
          # actually run here instead of skipping — raising the floor.
          sudo apt-get install -y xorriso dvdisaster qemu-user-static wine
          xorriso -version
          dvdisaster --version

      - name: Install LCSAS (editable, with dev deps)
        run: make dev

      - name: Build host tier-1 binaries + C unit tests
        # Gives the tier-1 hardening tests a build/lcsas-restore to target,
        # and runs the vendored C unit tests.  ~2 min.
        run: make -C recovery all test

      - name: Recovery hardening suite
        run: pytest tests/recovery_hardening/ -v --junitxml=/tmp/hardening.xml

      - name: Skip-rot floor
        # Fails if fewer than FLOOR tests passed — catches a regression that
        # silently turns assertions into skips.  See env.FLOOR for re-baseline.
        run: python3 scripts/ci_min_passed.py /tmp/hardening.xml --min-passed "$FLOOR"

      - name: Shell coverage floor (restore.sh)
        # GATE-09: a real, enforced line-coverage floor for the heir's single
        # entry point.  Fails the job if the trace-generating pytest run is
        # non-zero OR coverage drops below the documented Makefile threshold.
        # Self-contained (pytest + bash + tools/cov_shell.py); rides this job
        # because restore.sh's behavioral tests all live in recovery_hardening.
        run: make shell-coverage
