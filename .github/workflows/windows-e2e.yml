name: windows-e2e

# INFRA-01 Tier 3 — the Windows-journey gate.
#
# The single most likely heir journey is: Windows machine, double-click
# restore.bat.  It had ZERO functional coverage and currently dead-ends at
# repo discovery (UX-01).  This two-job workflow builds a real fixture on
# Linux, then on a real windows-latest runner mounts the ISOs, runs
# restore.bat unattended, and hash-compares the restored tree.
#
# EXPECTED STATE AT LANDING: the `restore` job is RED — it fails at
# restore.bat's broken repo discovery (UX-01).  That red is the proof the
# gate bites.  It flips green in the same PR series as the UX-01 fix.
#
# Public repo → windows-latest minutes are free.
#
# No `schedule:` here, on purpose (#462): GitHub disables a scheduled file
# after 60 quiet days, PR trigger and all, and the 2026-08-05 -> 10-15 quiet
# spell did.  The weekly run lives in windows-e2e-weekly.yml, which calls
# this file, so a quiet spell can now only switch off that.

on:
  pull_request:
    paths:
      - "recovery/scripts/**"
      - "src/lcsas/meta/**"
      - "src/lcsas/staging/metadata.py"
      # The set markers on the discs, and name_cmd (#606, #617).
      - "src/lcsas/staging/repo_marker.py"
      # The hidden-password leg runs the PowerShell lines of this doc
      # (#608), so a change to them must run it.
      - "recovery/docs/RECOVER_WINDOWS.txt"
      - "recovery/bin/x86_64-windows/**"
      - "tests/e2e/fixture_lib.py"
      - "tests/e2e/windows_e2e_lib.ps1"
      - ".github/workflows/windows-e2e.yml"
  workflow_dispatch:
  # The weekly run (windows-e2e-weekly.yml).
  workflow_call: {}

jobs:
  # ---------------------------------------------------------------------
  # Job 1 (Linux): build the fixture — real rustic repo + LCSAS ISOs +
  # meta ISO + a SHA-256 manifest of the restorable tree.
  # ---------------------------------------------------------------------
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      RUSTIC_VERSION: "0.11.2"
      RUSTIC_ASSET: "rustic-v0.11.2-x86_64-unknown-linux-gnu.tar.gz"
      RUSTIC_SHA256: "fb7b74a14418b2dd070360c9abb22607f8559bdd344a0adf1b33bc2e31f83f5f"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install rustic (pinned release tarball)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          cd "$(mktemp -d)"
          url="https://github.com/rustic-rs/rustic/releases/download/v${RUSTIC_VERSION}/${RUSTIC_ASSET}"
          curl -fsSL -o rustic.tar.gz "$url"
          actual=$(sha256sum rustic.tar.gz | awk '{print $1}')
          if [ "$RUSTIC_SHA256" != "$actual" ]; then
            echo "SHA256 mismatch: expected=$RUSTIC_SHA256 actual=$actual" >&2
            exit 1
          fi
          tar -xzf rustic.tar.gz
          install -m 0755 rustic "$HOME/.local/bin/rustic"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install xorriso
        run: |
          sh .github/scripts/apt-prepare.sh
          sudo apt-get update
          sudo apt-get install -y xorriso
          xorriso -version

      - name: Install LCSAS (editable, with dev deps)
        run: make dev

      # Sizing (#517): fixture_lib's defaults (12 x 64 KiB) fit ONE TEST_TINY
      # data disc, so the heir's multi-disc sweep was never exercised.  A
      # TEST_TINY disc is 2 MiB with a ~700 KB holographic reserve (~1.3 MiB
      # of packs), so 8 x 512 KiB (4 MiB of incompressible data,
      # fixture_lib.WINDOWS_E2E_FILE_COUNT/_BYTES) lands on four data discs.
      # Few, bigger files rather than many small ones: Defender real-time
      # scanning on the windows runner is per-file.
      #
      # Backup sets (#617): two, each registered with `lcsas repo add` as an
      # owner does, so the discs name their folders by UUID ids.  The one
      # restored has an accented name, which restore.bat shows as its
      # name_cmd ("_" for the accented letter); the second fills the set
      # menu, as on the drill's two-set archive (#606).  sets.json carries
      # their ids and names to the restore job, and which discs hold the
      # restored set's packs.  tests/integration/test_e2e_fixture_sets.py
      # builds this same fixture on every PR (make test-integration).
      #
      # Split password (#607): "Work documents" has its password split
      # 2-of-3 the way an owner does it (key_split in its config, then
      # `lcsas key split`, which records the split in the catalog), so
      # every disc's marker says split=2-of-3.  Its three printed cards
      # (invented, new every run) go into the artifact's cards/, and its
      # tree into manifest-other1.json, for the split-cards leg.
      - name: Build Windows fixture (rustic repos + ISOs + manifest)
        run: |
          set -euo pipefail
          mkdir -p fixture-out
          PYTHONPATH=src python3 - "$PWD/fixture-out" <<'PY'
          import json, sys
          from pathlib import Path

          sys.path.insert(0, "tests/e2e")
          import fixture_lib

          workdir = Path(sys.argv[1]).resolve()
          fx = fixture_lib.build_windows_fixture(
              workdir,
              file_count=fixture_lib.WINDOWS_E2E_FILE_COUNT,
              file_bytes=fixture_lib.WINDOWS_E2E_FILE_BYTES,
              # The single-drive leg mounts only the meta ISO, so the
              # backup set must be on it, as on a real meta disc (#617).
              meta_metadata=True,
              set_name=fixture_lib.WINDOWS_E2E_SET_NAME,
              other_set_names=fixture_lib.WINDOWS_E2E_OTHER_SET_NAMES,
              split_sets=fixture_lib.WINDOWS_E2E_SPLIT_SETS,
          )
          artifacts = {
              "meta_iso": str(fx.meta_iso),
              "data_isos": [str(p) for p in fx.data_isos],
              "manifest": str(fx.manifest_path),
              "password_file": str(fx.password_file),
              "sets": str(fx.sets_path),
          }
          (workdir / "artifacts.json").write_text(json.dumps(artifacts, indent=2))
          print(json.dumps(artifacts, indent=2))
          print(f"DATA_DISCS={len(fx.data_isos)}")
          # The Windows multi-disc leg is meaningless on one disc, and so
          # is it when the restored set's own packs fit one disc: the other
          # set's packs share the discs (#617).
          assert len(fx.data_isos) >= 2, (
              f"fixture produced {len(fx.data_isos)} data ISO(s); need >= 2"
          )
          for label, packs in json.loads(fx.sets_path.read_text())["restore_discs"].items():
              print(f"restored set: {len(packs)} pack(s) on {label}")
          problem = fixture_lib.restore_set_span_problem(fx.sets_path, minimum=2)
          assert problem is None, problem
          # The split set, its cards and its manifest (#607).
          for s in fx.other_sets:
              if s.split:
                  assert len(s.cards) == s.split[1], s.cards
                  for card in s.cards:
                      assert (workdir / card).is_file(), card
                  assert (workdir / s.manifest).is_file(), s.manifest
                  print(f"{s.name}: split {s.split[0]}-of-{s.split[1]}, {len(s.cards)} cards")
          PY
          # Flatten the produced artifacts into an upload dir.  data ISOs +
          # meta ISO live under fixture-out/iso_out/.
          mkdir -p upload
          cp fixture-out/iso_out/*.iso        upload/
          cp fixture-out/manifest.json        upload/
          cp fixture-out/manifest-*.json      upload/
          cp fixture-out/repo.pw              upload/repo.pw
          cp fixture-out/sets.json            upload/sets.json
          cp -r fixture-out/cards             upload/cards
          cat upload/sets.json
          ls -la upload/

      - name: Upload fixture artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-fixture
          path: upload/
          retention-days: 7

  # ---------------------------------------------------------------------
  # Job 2 (Windows): mount the ISOs, run restore.bat unattended, verify.
  # ---------------------------------------------------------------------
  restore:
    runs-on: windows-latest
    needs: fixture
    # 60, not 40, since the stop-and-resume leg (#609) runs a second
    # one-drive restore.
    timeout-minutes: 60

    steps:
      # Only for tests/e2e/windows_e2e_lib.ps1 (the multi-disc, relocation
      # and eject legs).  `path: repo` keeps checkout's clean away from the
      # downloaded fixture dir.
      - name: Checkout test helpers
        uses: actions/checkout@v4
        with:
          path: repo
          sparse-checkout: tests/e2e

      - name: Download fixture artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-fixture
          path: fixture

      - name: Mount ISOs and run restore.bat (happy path)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . (Join-Path $env:GITHUB_WORKSPACE 'repo/tests/e2e/windows_e2e_lib.ps1')
          $fixture = Join-Path $PWD "fixture"

          # Mount every ISO; collect drive letters.  The meta ISO carries
          # restore.bat + the tier-1 .exe; data ISOs carry pack data\.
          $metaDrive = $null
          $isos = Get-ChildItem -Path $fixture -Filter *.iso
          foreach ($iso in $isos) {
            $img = Mount-DiskImage -ImagePath $iso.FullName -PassThru
            $vol = Get-Volume -DiskImage $img
            $letter = $vol.DriveLetter
            Write-Host "Mounted $($iso.Name) at ${letter}:"
            if (Test-Path "${letter}:\restore.bat") { $metaDrive = $letter }
          }
          if (-not $metaDrive) { throw "no restore.bat found on any mounted ISO" }

          $target = Join-Path $env:RUNNER_TEMP "restored"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $pw = (Get-Content (Join-Path $fixture "repo.pw") -Raw).Trim()

          # answers.txt: target dir, password, then generous trailing blank
          # lines so a stray pause/set /p on any error branch never blocks
          # on an empty stream until the job timeout.
          $answers = Join-Path $env:RUNNER_TEMP "answers.txt"
          @($target, $pw, "", "", "", "", "", "") | Set-Content -Path $answers -Encoding ascii

          $env:LCSAS_NO_RELOCATE = "1"
          # Two backup sets: the set is named by its id (#617), so no menu
          # takes the first answer.  The single-drive leg uses the menu.
          $sets = Get-FixtureSets -Fixture $fixture
          $env:LCSAS_REPO = $sets.restore.id
          $bat = "${metaDrive}:\restore.bat"
          $outFile = Join-Path $env:RUNNER_TEMP "happy-out.txt"
          Write-Host "Running: cmd /c `"$bat`" < answers.txt (LCSAS_REPO=$($env:LCSAS_REPO))"
          # Redirect inside the cmd /c string, so $LASTEXITCODE is restore.bat's.
          cmd /c "`"$bat`" < `"$answers`" > `"$outFile`" 2>&1"
          $rc = $LASTEXITCODE
          $out = Get-Content $outFile -Raw
          Write-Host $out
          Write-Host "restore.bat exit code: $rc"
          "RESTORE_RC=$rc"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          "TARGET_DIR=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding ascii
          if ($rc -ne 0) { throw "restore.bat failed (rc=$rc) — see log above" }
          $problems = New-Object 'System.Collections.Generic.List[string]'
          Assert-SetNamed -Out $out -Sets $sets -Problems $problems
          if ($problems.Count -gt 0) { throw ($problems -join "`n") }

      - name: Verify restored tree matches manifest (byte-exact)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $fixture  = Join-Path $PWD "fixture"
          $manifest = Get-Content (Join-Path $fixture "manifest.json") -Raw | ConvertFrom-Json
          $target   = $env:TARGET_DIR

          # rustic restores the original absolute-ish source path under the
          # target; locate the leaf dir that actually holds file_000.bin.
          $anchor = Get-ChildItem -Path $target -Recurse -Filter "file_000.bin" `
                    | Select-Object -First 1
          if (-not $anchor) { throw "restored tree has no file_000.bin under $target" }
          $root = $anchor.Directory.FullName
          Write-Host "Restored tree root: $root"

          $fail = $false
          foreach ($p in $manifest.PSObject.Properties) {
            $rel = $p.Name; $want = $p.Value
            $f = Join-Path $root $rel
            if (-not (Test-Path $f)) { Write-Host "MISSING: $rel"; $fail = $true; continue }
            $got = (Get-FileHash -Algorithm SHA256 $f).Hash.ToLower()
            if ($got -ne $want) { Write-Host "HASH MISMATCH: $rel"; $fail = $true }
          }
          # No extra files beyond the manifest.
          $expected = @($manifest.PSObject.Properties.Name)
          Get-ChildItem -Path $root -Recurse -File | ForEach-Object {
            $rel = $_.FullName.Substring($root.Length).TrimStart('\').Replace('\','/')
            if ($expected -notcontains $rel) { Write-Host "EXTRA: $rel"; $fail = $true }
          }
          if ($fail) { throw "restored tree does not match manifest" }
          Write-Host "Restored tree is byte-identical to manifest."

      # ---- #517: multi-disc sweep ------------------------------------------
      # The happy path above mounted EVERY ISO, so restore.bat's D..Z scan
      # handed all the data discs to lcsas-restore.exe as --pack-search and
      # the restore consumed packs from several of them with no swap prompt.
      # restore.bat prints nothing about its --pack-search drives, and --repo
      # (X:\metadata\<id>) holds no data\, so we assert it structurally.
      # The fixture job proved the RESTORED set's own packs lie on two or
      # more data discs, none holding them all (restore_set_span_problem;
      # the other set's packs share the discs, so a count of every pack
      # would prove nothing, #617).  This step checks those discs are
      # mounted and hold packs; with the byte-exact check above, packs
      # necessarily came from more than one disc.
      - name: Multi-disc — the restore swept more than one data disc
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . (Join-Path $env:GITHUB_WORKSPACE 'repo/tests/e2e/windows_e2e_lib.ps1')
          Assert-MultiDisc -Minimum 2

      # ---- #517: single-drive relocation -------------------------------------
      # Same restore, but WITHOUT LCSAS_NO_RELOCATE, so the "Single-drive
      # guard" block runs: it probes the (read-only) ISO, copies the script
      # and this computer's programs into the tools folder,
      # %LOCALAPPDATA%\LCSAS-restore (#609, #612), re-execs the copy and
      # sets LCSAS_RELOCATED, so tier 1 skips the meta drive while the meta
      # disc is in it (and searches it once a data disc is, #604).  Started
      # with cwd on the disc, like a double-click.  The nested-layout run
      # first leaves a stale tools folder behind, which must be replaced
      # (wine's fc cannot tell two files apart, so only this proves it).
      #
      # Both copies of the script are run: the one at the disc root
      # (E:\restore.bat, what the heir double-clicks) and
      # recovery\scripts\restore.bat.  Until #531 the root copy mirrored
      # "%~dp0..\bin" = E:\bin, which does not exist, so its RAM copy had no
      # binaries and ended in "no working recovery method" (this step found
      # it, #517).
      - name: Relocation leg — restore.bat at the disc root (the heir's double-click)
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          . (Join-Path $env:GITHUB_WORKSPACE 'repo/tests/e2e/windows_e2e_lib.ps1')
          Invoke-RelocationLeg -Fixture (Join-Path $PWD 'fixture') `
            -BatRel 'restore.bat' -TargetName 'restored-reloc-root'

      - name: Relocation leg — recovery\scripts\restore.bat layout
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          . (Join-Path $env:GITHUB_WORKSPACE 'repo/tests/e2e/windows_e2e_lib.ps1')
          Invoke-RelocationLeg -Fixture (Join-Path $PWD 'fixture') `
            -BatRel 'recovery\scripts\restore.bat' -TargetName 'restored-reloc-nested' -SeedStale `
            -PickBy name_cmd

      - name: Negative case — wrong password fails cleanly
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # pwsh 7.4+ turns a non-zero native exit into a terminating
          # error; here a non-zero `cmd /c` is the EXPECTED outcome (wrong
          # password), so opt out and let this step's own assertions on
          # $LASTEXITCODE decide pass/fail.
          $PSNativeCommandUseErrorActionPreference = $false
          . (Join-Path $env:GITHUB_WORKSPACE 'repo/tests/e2e/windows_e2e_lib.ps1')
          $fixture = Join-Path $PWD "fixture"
          # The set by the name restore.bat shows (its name_cmd), which
          # LCSAS_REPO must match as well as the id (#606).
          $sets = Get-FixtureSets -Fixture $fixture
          $env:LCSAS_REPO = $sets.restore.name_cmd
          $metaDrive = $null
          foreach ($d in (Get-Volume | Where-Object { $_.DriveLetter })) {
            if (Test-Path "$($d.DriveLetter):\restore.bat") { $metaDrive = $d.DriveLetter }
          }
          if (-not $metaDrive) { throw "meta ISO no longer mounted" }

          $target = Join-Path $env:RUNNER_TEMP "restored-wrong"
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          $answers = Join-Path $env:RUNNER_TEMP "answers-wrong.txt"
          @($target, "definitely-the-wrong-password", "", "", "", "") `
            | Set-Content -Path $answers -Encoding ascii

          $env:LCSAS_NO_RELOCATE = "1"
          # Do BOTH redirections INSIDE the cmd /c string so PowerShell
          # sees only a bare `cmd /c "..."` — a PowerShell-level `> file
          # 2>&1` on the native command resets $LASTEXITCODE to 0 and we
          # lose restore.bat's exit /b 77.  cmd does the redirect and
          # returns the batch's real exit code.
          $outFile = Join-Path $env:RUNNER_TEMP "wrong-out.txt"
          cmd /c "`"${metaDrive}:\restore.bat`" < `"$answers`" > `"$outFile`" 2>&1"
          $rc = $LASTEXITCODE
          $out = Get-Content $outFile -Raw
          Write-Host $out
          Write-Host "wrong-password exit code: $rc"
          # #384 contract: a wrong password is TERMINAL with the DISTINCT
          # exit status 77 — not a generic non-zero — and tier 2 must
          # never be attempted (it would leave a partial tree first).
          if ($rc -ne 77) { throw "restore.bat must exit 77 on a wrong password; got $rc" }
          if ($out -match "trying tier 2") { throw "restore.bat fell through to tier 2 on a wrong password" }
          if ($out -match "Access is denied") { throw "restore.bat printed 'Access is denied.' (#611)" }
          if ($out -notmatch "could not decrypt the repository") { throw "wrong-password banner missing from output" }
          $problems = New-Object 'System.Collections.Generic.List[string]'
          Assert-SetNamed -Out $out -Sets $sets -Problems $problems
          if ($problems.Count -gt 0) { throw ($problems -join "`n") }
          # No restored data may be left behind.  restore.bat drops a
          # .lcsas-restore-marker resume sentinel into the target BEFORE
          # any tier runs (UX-07); it is script state, not tier output,
          # so exclude it by NAME.  -Force so a marker is seen and
          # filtered regardless of attributes; anything else is a real
          # partial tree.
          $restored = Get-ChildItem -Path $target -Recurse -File -Force -ErrorAction SilentlyContinue |
                      Where-Object { $_.Name -ne '.lcsas-restore-marker' }
          if ($restored) { throw "wrong-password run left a partial tree behind: $($restored.FullName -join ', ')" }
          Write-Host "Wrong-password case failed cleanly (rc=77, terminal, no partial tree)."
          # All assertions passed; throw above is the only failure path.
          # Without this, the step inherits the lingering $LASTEXITCODE=77
          # from the intentional wrong-password `cmd /c` and reports red.
          exit 0

      # #545: the relaunch line removes the relocated copy after it returns.
      # Commands after the `call` can replace its exit code, and every
      # other relocated leg expects 0, so this one checks that a wrong
      # password still exits 77 through the relocation, with no copy left.
      - name: Relocated wrong password — exit 77 survives the cleanup
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          . (Join-Path $env:GITHUB_WORKSPACE 'repo/tests/e2e/windows_e2e_lib.ps1')
          Invoke-RelocatedWrongPasswordLeg -Fixture (Join-Path $PWD 'fixture') `
            -BatRel 'restore.bat' -TargetName 'restored-reloc-wrong'
          # The leg throws on any failure; without this the step inherits
          # the intended $LASTEXITCODE=77 and reports red.
          exit 0

      # ---- #608: the hidden-password route of RECOVER_WINDOWS.txt ----------
      # The doc's PowerShell lines ("THE PASSWORD") are read from the META
      # disc and run under Windows PowerShell 5.1 (powershell.exe), with
      # only Read-Host -AsSecureString replaced, so it is the doc's text
      # that is tested; the leg fails if those lines cannot be found.  They
      # must write the password byte for byte to %TEMP%\lcsas-pw.txt.  Then
      # restore.bat (from the disc, so relocated) restores with
      # LCSAS_PWFILE set to that file and LCSAS_REPO naming the set: no
      # password question, tree byte-exact, the reader's file kept, no
      # lcsas-pw-* left.  It mounts every ISO itself.
      - name: Hidden-password leg — RECOVER_WINDOWS.txt's PowerShell 5.1 lines, then LCSAS_PWFILE
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          . (Join-Path $env:GITHUB_WORKSPACE 'repo/tests/e2e/windows_e2e_lib.ps1')
          Invoke-HiddenPasswordLeg -Fixture (Join-Path $PWD 'fixture') `
            -BatRel 'restore.bat' -TargetName 'restored-doc-password'

      # ---- #517: eject the meta disc after relocation ------------------------
      # LAST before the dismount step, because it ejects the meta ISO (the
      # wrong-password step re-finds the meta drive by scanning volumes).
      # restore.bat blocks on a stdin pipe we hold open; once the relocated
      # copy is up we Dismount-DiskImage the meta ISO and only then feed it
      # the target + password, so tier 1 runs entirely after the eject.
      # Started from the disc-root restore.bat, the copy the heir runs.
      - name: Eject leg — relocated restore survives a meta-disc eject
        shell: pwsh
        timeout-minutes: 10
        run: |
          $ErrorActionPreference = "Stop"
          . (Join-Path $env:GITHUB_WORKSPACE 'repo/tests/e2e/windows_e2e_lib.ps1')
          Invoke-EjectLeg -Fixture (Join-Path $PWD 'fixture') `
            -BatRel 'restore.bat' -TargetName 'restored-eject'

      # ---- #604/#617: ONE optical drive ------------------------------------
      # Every leg above has each ISO at its own drive letter.  A reader with
      # one drive has only the meta disc in at the start and puts each data
      # disc into that SAME letter when tier 1 asks.  Up to rc5 restore.bat
      # never gave tier 1 that letter, and nothing here caught it.  This leg
      # dismounts everything, mounts only the meta ISO, runs the relocated
      # restore.bat with LCSAS_INTERACTIVE=on, answers the newest-data-disc
      # step (#605) by putting the newest data ISO into the meta disc's
      # letter, picks the set from the set menu, which must list both sets
      # by name and neither by id (#606), and at each disc box moves the
      # named data ISO into that letter (Dismount-DiskImage,
      # Mount-DiskImage -NoDriveLetter, mountvol) and presses ENTER.
      # Runs after the eject leg: it starts by dismounting every ISO.
      - name: Single-drive leg — every data disc swapped into one drive letter
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"
          . (Join-Path $env:GITHUB_WORKSPACE 'repo/tests/e2e/windows_e2e_lib.ps1')
          Invoke-SingleDriveLeg -Fixture (Join-Path $PWD 'fixture') `
            -BatRel 'restore.bat' -TargetName 'restored-single-drive'

      # ---- #609/#615: stop, then carry on without the META disc -----------
      # One drive again.  q at the second disc box: tier 1 exits 75, the
      # tools folder stays with resume.cfg (no password) and the launcher
      # "Resume LCSAS restore.bat", also on the Desktop.  Then, with a data
      # disc in the META disc's letter, the Desktop launcher finishes the
      # restore: exit 0, tree byte-exact, tools folder and launcher gone.
      # Runs the launcher's (goto) line, which wine cannot.  The newest-
      # data-disc step is skipped (LCSAS_NEWEST_DISC_PROMPT=0) so the boxes
      # count from the META disc on; the single-drive leg runs the step.
      - name: Stop-and-resume leg — q at a disc box, then the Desktop launcher
        shell: pwsh
        timeout-minutes: 25
        run: |
          $ErrorActionPreference = "Stop"
          . (Join-Path $env:GITHUB_WORKSPACE 'repo/tests/e2e/windows_e2e_lib.ps1')
          Invoke-StopAndResumeLeg -Fixture (Join-Path $PWD 'fixture') `
            -BatRel 'restore.bat' -TargetName 'restored-stop-resume'

      # ---- #607: the split set, by typing two share cards ------------------
      # One drive, as in the single-drive leg, but the set chosen from the
      # menu is "Work documents", whose password is split 2-of-3: the menu
      # must say so, and the script asks for the cards, not the password.
      # Card 1 is typed first with one word that is no share word (the
      # script names it and asks for card 1 again), then right, then card
      # 3.  While the tools folder is still there (at "Restore another
      # backup set?"), no file in it may hold three card words in a row.
      - name: Split-cards leg — two of three share cards typed, one with a wrong word first
        shell: pwsh
        timeout-minutes: 20
        run: |
          $ErrorActionPreference = "Stop"
          . (Join-Path $env:GITHUB_WORKSPACE 'repo/tests/e2e/windows_e2e_lib.ps1')
          Invoke-SplitCardsLeg -Fixture (Join-Path $PWD 'fixture') `
            -BatRel 'restore.bat' -TargetName 'restored-split-cards'

      - name: Dismount ISOs
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path (Join-Path $PWD "fixture") -Filter *.iso `
            -ErrorAction SilentlyContinue | ForEach-Object {
              Dismount-DiskImage -ImagePath $_.FullName -ErrorAction SilentlyContinue | Out-Null
            }
